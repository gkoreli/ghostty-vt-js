<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ghostty-vt-js · Ghostty's terminal engine, in your browser</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0b1018; color: #e6edf6; }
      main { max-width: 1200px; margin: auto; padding: 38px 48px 24px; }
      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
      .eyebrow { color: #73e0c1; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
      h1 { font-size: 34px; letter-spacing: -1px; margin: 8px 0 0; font-weight: 650; }
      button { color: #a9b9cc; background: transparent; border: 1px solid #2b3c50; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
      button:disabled { opacity: .4; cursor: default; }
      .window { border: 1px solid #2b3c50; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px #0006; }
      .bar { background: #17212f; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 12px; color: #95a7bc; }
      .dots { display: flex; gap: 7px; }
      .dots i { width: 9px; height: 9px; background: #ff6b6b; border-radius: 50%; }
      .dots i:nth-child(2) { background: #ffd166; } .dots i:nth-child(3) { background: #73e0c1; }
      #terminal { height: 430px; overflow: hidden; background: #101722; }
      footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 18px; font-size: 12px; color: #95a7bc; }
      #scene { color: #73e0c1; }
      @media (max-width: 700px) { main { padding: 20px 14px; } h1 { font-size: 24px; } footer { flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><div class="eyebrow">ghostty-vt-js</div><h1>Ghostty's terminal engine. In your browser.</h1></div>
        <button id="play" type="button" disabled>Play demo</button>
      </header>
      <div class="window">
        <div class="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="title">libghostty-vt / WebAssembly</span><span id="backend">Loading…</span></div>
        <div id="terminal" aria-label="Terminal rendering showcase"></div>
      </div>
      <footer><span id="scene" role="status">Loading the pinned Ghostty WASM…</span><span>Scripted ANSI demo · actual terminal rendering · no shell</span></footer>
    </main>
    <script type="module" src="./showcase.ts"></script>
  </body>
</html>
