<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ghostty-vt-js · Built to keep up</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0b1018; color: #e6edf6; }
      main { max-width: 1200px; margin: auto; padding: 26px 40px 20px; }
      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
      .eyebrow { color: #73e0c1; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
      h1 { font-size: 32px; letter-spacing: -1px; margin: 6px 0 0; font-weight: 650; }
      button { color: #a9b9cc; background: transparent; border: 1px solid #2b3c50; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
      button:disabled { opacity: .4; cursor: default; }
      .chapters { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 14px; }
      .chapter { padding: 8px 0; border-bottom: 2px solid #263344; color: #8192a7; font-size: 12px; letter-spacing: .4px; }
      .chapter b { margin-right: 10px; font-weight: 500; opacity: .6; }
      .chapter[data-active="true"] { color: #73e0c1; border-color: #73e0c1; }
      .window { border: 1px solid #2b3c50; border-radius: 10px; overflow: hidden; }
      .bar { background: #17212f; height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 12px; color: #95a7bc; }
      .dots { display: flex; gap: 7px; }
      .dots i { width: 9px; height: 9px; background: #ff6b6b; border-radius: 50%; }
      .dots i:nth-child(2) { background: #ffd166; } .dots i:nth-child(3) { background: #73e0c1; }
      #backend { color: #73e0c1; font-size: 10px; letter-spacing: 1px; }
      #terminal { height: 400px; overflow: hidden; background: #101722; }
      .telemetry { display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 1px solid #263344; padding: 14px 0 12px; }
      .metric { border-right: 1px solid #263344; padding-left: 24px; }
      .metric:first-child { padding-left: 0; } .metric:last-child { border: 0; }
      .metric label { display: block; color: #95a7bc; font-size: 11px; margin-bottom: 3px; }
      .value { font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 600; color: #e6edf6; }
      .unit { color: #95a7bc; font-size: 12px; margin-left: 5px; }
      footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 11px; color: #8192a7; }
      #scene { color: #73e0c1; }
      @media (max-width: 700px) {
        main { padding: 18px 14px; } h1 { font-size: 24px; }
        .chapter { font-size: 10px; } .chapter b { margin-right: 3px; }
        footer { flex-direction: column; } .metric { padding-left: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><div class="eyebrow">ghostty-vt-js</div><h1>Ghostty's engine. Built to keep up.</h1></div>
        <button id="play" type="button" disabled>Play demo</button>
      </header>
      <nav class="chapters" aria-label="Demo chapters">
        <span class="chapter"><b>01</b>10,000 LINES</span>
        <span class="chapter"><b>02</b>SMOOTH SCROLL</span>
        <span class="chapter"><b>03</b>COLOR + UNICODE</span>
        <span class="chapter"><b>04</b>LIVE REDRAW</span>
      </nav>
      <div class="window">
        <div class="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="title">libghostty-vt / WebAssembly</span><span id="backend">Loading…</span></div>
        <div id="terminal" aria-label="Terminal rendering showcase"></div>
      </div>
      <div class="telemetry" aria-label="Live measurements during capture">
        <div class="metric"><label>Browser frame cadence</label><span id="cadence" class="value">—</span><span class="unit">fps</span></div>
        <div class="metric"><label>Render CPU · p95 / last 0.5s</label><span id="cpu" class="value">—</span><span class="unit">ms</span></div>
        <div class="metric"><label>Styled lines fed to WASM</label><span id="lines" class="value">0</span><span class="unit">/ 10,000</span></div>
      </div>
      <footer><span id="scene" role="status">Loading the pinned Ghostty WASM…</span><span>Live capture metrics · scripted workload · not a benchmark</span></footer>
    </main>
    <script type="module" src="./showcase.ts"></script>
  </body>
</html>
