name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          install_args: bun
          cache: true

      - name: Verify pinned Bun
        run: test "$(bun --version)" = "1.4.2"

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Build, typecheck, and test
        run: mise run check

      - name: Verify package contents
        run: bun run pack:dry-run
